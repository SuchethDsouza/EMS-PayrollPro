<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayrollPro — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand:      #e85d42;
      --brand-dk:   #c94a30;
      --brand-glow: rgba(232,93,66,.22);
      --navy:       #1a2035;
      --text-2:     #a8b8d0;
      --text-3:     #5577aa;
      --font:       'DM Sans', system-ui, sans-serif;
    }
    html, body { height: 100%; font-family: var(--font); background: var(--navy); color: #fff; overflow-x: hidden; }

    .page-bg {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a2035 0%, #1e2d50 55%, #162040 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px; position: relative; overflow: hidden;
    }
    .page-bg::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 48px 48px; pointer-events: none;
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
    .orb-1 { width: 480px; height: 480px; background: rgba(232,93,66,.13); top: -120px; left: -100px; }
    .orb-2 { width: 360px; height: 360px; background: rgba(79,70,229,.1); bottom: -80px; right: -80px; }

    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 44px 40px;
      box-shadow: 0 40px 100px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06);
    }
    @media (max-width: 480px) { .card { padding: 32px 22px; } }

    .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: #1C1B2E;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; overflow: hidden;
    }
    .brand-text { display: flex; flex-direction: column; }
    .brand-name { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -.4px; line-height: 1.15; }
    .brand-name span { color: #e85d42; }
    .brand-sub  { font-size: 9.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #4a5a7a; margin-top: 2px; display: block; }

    .icon-wrap {
      width: 54px; height: 54px; border-radius: 14px;
      background: rgba(5,150,105,.15);
      border: 1px solid rgba(5,150,105,.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; margin-bottom: 20px;
    }
    .form-eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--brand); margin-bottom: 8px; }
    .form-title   { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -.4px; margin-bottom: 8px; }
    .form-sub     { font-size: 13px; color: var(--text-2); line-height: 1.6; margin-bottom: 28px; }

    .alert-err { background: rgba(220,38,38,.15); border: 1px solid rgba(220,38,38,.3); color: #fca5a5; border-radius: 9px; padding: 10px 14px; font-size: 13px; margin-bottom: 18px; display: flex; gap: 8px; align-items: center; }

    .fgroup { margin-bottom: 18px; }
    .fgroup label { display: block; font-size: 11.5px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 7px; }
    .finput {
      width: 100%; padding: 11px 14px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 9px; color: #fff;
      font-family: var(--font); font-size: 13.5px;
      outline: none; transition: border-color .2s, background .2s;
    }
    .finput::placeholder { color: rgba(255,255,255,.28); }
    .finput:focus { border-color: var(--brand); background: rgba(255,255,255,.1); box-shadow: 0 0 0 3px rgba(232,93,66,.14); }

    .pw-wrap { position: relative; }
    .pw-wrap .finput { padding-right: 44px; }
    .pw-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 15px; color: rgba(255,255,255,.3); line-height: 1; transition: color .15s; }
    .pw-toggle:hover { color: rgba(255,255,255,.65); }

    .strength-bar-wrap { height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .strength-bar { height: 100%; border-radius: 2px; width: 0; transition: width .3s, background .3s; }
    .strength-hint { font-size: 11px; color: var(--text-3); margin-top: 4px; height: 14px; }

    .btn-primary {
      width: 100%; padding: 12px; background: var(--brand); color: #fff;
      border: none; border-radius: 9px; font-family: var(--font);
      font-size: 14px; font-weight: 700; cursor: pointer; transition: all .2s;
      box-shadow: 0 4px 16px var(--brand-glow);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover { background: var(--brand-dk); transform: translateY(-1px); box-shadow: 0 8px 24px var(--brand-glow); }

    .back-link { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 22px; font-size: 13px; color: var(--text-2); transition: color .15s; text-decoration: none; }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>
<div class="page-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">

    <div class="brand-row">
            <div class="brand-icon">
        <svg width="36" height="36" viewBox="0 0 36 36" style="display:block;">
          <rect x="7"  y="7"  width="7"  height="22" rx="2.5" fill="#ffffff"/>
          <rect x="14" y="7"  width="13" height="6"  rx="2.5" fill="#E85D42"/>
          <rect x="21" y="7"  width="6"  height="16" rx="2.5" fill="#E85D42"/>
          <rect x="14" y="17" width="13" height="6"  rx="2.5" fill="#E85D42"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">Payroll<span>Pro</span></span>
        <span class="brand-sub">Management System</span>
      </div>
    </div>

    <div class="icon-wrap">🛡️</div>
    <div class="form-eyebrow">Set new password</div>
    <div class="form-title">Reset your password</div>
    <div class="form-sub">Choose a strong new password for your account. The link expires in 1 hour.</div>

    {% if error %}
    <div class="alert-err">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('reset_password', token=token) }}">

      <div class="fgroup">
        <label>New Password *</label>
        <div class="pw-wrap">
          <input type="password" name="new_password" id="pw1" class="finput"
                 placeholder="Min. 6 characters" required autofocus
                 autocomplete="new-password" oninput="checkStrength(this.value)">
          <button type="button" class="pw-toggle" onclick="togglePw('pw1')">👁</button>
        </div>
        <div class="strength-bar-wrap"><div class="strength-bar" id="strengthBar"></div></div>
        <div class="strength-hint" id="strengthHint"></div>
      </div>

      <div class="fgroup">
        <label>Confirm New Password *</label>
        <div class="pw-wrap">
          <input type="password" name="confirm_password" id="pw2" class="finput"
                 placeholder="Repeat your new password" required
                 autocomplete="new-password">
          <button type="button" class="pw-toggle" onclick="togglePw('pw2')">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Reset Password
      </button>

    </form>

    <a href="{{ url_for('login') }}" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back to Sign In
    </a>

  </div>
</div>

<script>
function togglePw(id) {
  const f = document.getElementById(id);
  f.type = (f.type === 'password') ? 'text' : 'password';
}
function checkStrength(val) {
  const bar  = document.getElementById('strengthBar');
  const hint = document.getElementById('strengthHint');
  let score = 0;
  if (val.length >= 6)  score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const levels = [
    { w:'0%',   bg:'transparent', txt:'' },
    { w:'25%',  bg:'#dc2626',     txt:'Weak' },
    { w:'50%',  bg:'#d97706',     txt:'Fair' },
    { w:'75%',  bg:'#0ea5e9',     txt:'Good' },
    { w:'100%', bg:'#059669',     txt:'Strong ✓' },
  ];
  const lvl = levels[Math.min(score, 4)];
  bar.style.width      = lvl.w;
  bar.style.background = lvl.bg;
  hint.textContent     = lvl.txt;
  hint.style.color     = lvl.bg;
}
</script>
</body>
</html>
